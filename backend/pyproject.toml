[project]
name = "business-issue-assistant-api"
version = "0.1.0"
description = "业务问题助手接口服务"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.15,<2",
  "pydantic-settings>=2.8,<3",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28.1,<1",
  "cryptography>=45,<50",
]

[dependency-groups]
dev = [
 "httpx2>=2.16.1,<3",
 "mypy>=2.4.1",
 "pytest>=8,<10",
 "ruff>=0.11,<1",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
plugins = ["pydantic.mypy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
